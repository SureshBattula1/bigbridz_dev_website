<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-gray-100">
  <div class="max-w-6xl mx-auto flex items-center justify-between px-4 md:px-6 lg:px-8 py-3">
    <a routerLink="" class="flex items-center">
      <img 
        src="assets/images/company/bblogo.jpg" 
        alt="BigBridz Logo" 
        class="h-14 w-auto object-contain"
      />
    </a>

    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-700">
      <a routerLink="" routerLinkActive="text-primary" [routerLinkActiveOptions]="{ exact: true }" class="hover:text-primary transition">Home</a>
      <a routerLink="services" routerLinkActive="text-primary" class="hover:text-primary transition">Services</a>
      <div
        class="relative"
        (mouseenter)="onSolutionsMouseEnter()"
        (mouseleave)="onSolutionsMouseLeave()"
      >
        <a
          routerLink="solutions"
          routerLinkActive="text-primary"
          class="hover:text-primary transition flex items-center gap-1 cursor-pointer"
        >
          Solutions
          <svg class="w-4 h-4 transition-transform" [class.rotate-180]="showSolutionsDropdown" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="shape-rendering: geometricPrecision;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" vector-effect="non-scaling-stroke"></path>
          </svg>
        </a>
        @if (showSolutionsDropdown) {
          <div class="absolute top-full left-0 mt-2 w-72 bg-white rounded-xl shadow-2xl border border-gray-100 py-3 z-50 solutions-dropdown">
            <div class="px-3 py-2 border-b border-gray-100 mb-1">
              <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide">Industry Solutions</p>
            </div>
            @for (solution of solutions; track solution.title) {
              <a
                [routerLink]="solution.route"
                class="flex items-center gap-3 px-4 py-3 hover:bg-gradient-to-r hover:from-primary/5 hover:to-navy/5 transition-all group border-l-2 border-transparent hover:border-primary"
                (click)="showSolutionsDropdown = false"
              >
                <app-icon [name]="solution.icon" size="20" class="text-primary transform group-hover:scale-110 transition-transform"></app-icon>
                <span class="text-sm font-medium text-gray-700 group-hover:text-primary transition-colors flex-1">{{ solution.title }}</span>
                <app-icon name="arrow-right" size="16" class="text-gray-400 group-hover:text-primary opacity-0 group-hover:opacity-100 transition-all"></app-icon>
              </a>
            }
            <div class="px-4 py-2 mt-2 border-t border-gray-100">
              <a
                routerLink="solutions"
                class="text-xs font-semibold text-primary hover:text-accent transition-colors flex items-center gap-1"
                (click)="showSolutionsDropdown = false"
              >
                View All Solutions
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" style="shape-rendering: geometricPrecision;">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" vector-effect="non-scaling-stroke"></path>
                </svg>
              </a>
            </div>
          </div>
        }
      </div>
      <a routerLink="portfolio" routerLinkActive="text-primary" class="hover:text-primary transition">Portfolio</a>
      <a routerLink="company" routerLinkActive="text-primary" class="hover:text-primary transition">Company</a>
      <a routerLink="career" routerLinkActive="text-primary" class="hover:text-primary transition">Careers</a>
      <a routerLink="blog" routerLinkActive="text-primary" class="hover:text-primary transition">Blog</a>
    </nav>

    <div class="hidden md:flex">
      <a routerLink="contact" class="btn-primary">Get a Quote</a>
    </div>
  </div>
</header>
