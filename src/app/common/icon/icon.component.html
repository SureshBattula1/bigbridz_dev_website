<svg
  [attr.width]="size"
  [attr.height]="size"
  [attr.class]="class"
  fill="none"
  viewBox="0 0 24 24"
  stroke-width="2"
  stroke="currentColor"
  xmlns="http://www.w3.org/2000/svg"
  style="shape-rendering: geometricPrecision;"
>
  <path
    stroke-linecap="round"
    stroke-linejoin="round"
    [attr.d]="iconPath"
    vector-effect="non-scaling-stroke"
  />
</svg>
